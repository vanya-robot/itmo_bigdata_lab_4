name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  docker-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: docker compose version

      - name: Build Docker image
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for services to be ready
        run: sleep 30

      - name: Check /health endpoint
        run: curl -sSf http://localhost:8000/health

      - name: Check /predict endpoint
        run: |
          curl -sSf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"island":"Torgersen","culmen_length_mm":39.1,"culmen_depth_mm":18.7,"flipper_length_mm":181.0,"body_mass_g":3750.0,"sex":"MALE"}' \
            | grep -q '"species":'

      - name: Shut down services
        run: docker compose down